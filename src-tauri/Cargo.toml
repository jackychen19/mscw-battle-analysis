[package]
name = "battle-analysis"
description = "Battle Analysis — EXP/meso tracker for MapleStory Classic World"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "battle_analysis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# No doctests here, and rustdoc linking this crate type takes ~20 minutes.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
battle-core = { path = "../crates/battle-core" }
tauri = { version = "2", features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# One-shot window screenshots of just the text regions (macOS 14+).
screencapturekit = { version = "=2.1.0", features = ["macos_14_0"] }
# Screen Recording permission check / request.
core-graphics = "0.25"
