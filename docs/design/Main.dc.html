<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battle Analysis idle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffd23f}a:hover{color:#ffe27a}
</style>
</helmet>
<div style="width: 360px; height: 420px; box-sizing: border-box; padding: 30px; background: #33402f; display: flex; align-items: flex-start; justify-content: center; font-family: Nunito, system-ui, sans-serif">
<div style="width: 300px; box-sizing: border-box; padding: 10px; border-radius: 12px; background: #2b3139; border: 2px solid #8c939c; box-shadow: inset 0 0 0 1px #4d555f, 0 6px 18px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 0 4px">
<div style="font-size: 15px; font-weight: 900; letter-spacing: 0.04em; color: #f4f4f4">BATTLE ANALYSIS</div>
<div style="display: flex; gap: 4px">
<button aria-label="Help" style="width: 24px; height: 24px; padding: 0; border-radius: 5px; border: 1px solid #5c636c; background: #3d444d; color: #e8e8e8; font: 800 13px Nunito, sans-serif">?</button>
<button aria-label="Settings and calibration" style="width: 24px; height: 24px; padding: 0; border-radius: 5px; border: 1px solid #4f7d1f; background: #6fa52e; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M19.11 9.32 L22.20 9.50 L22.20 14.50 L19.11 14.68 L18.92 15.14 L20.98 17.45 L17.45 20.98 L15.14 18.92 L14.68 19.11 L14.50 22.20 L9.50 22.20 L9.32 19.11 L8.86 18.92 L6.55 20.98 L3.02 17.45 L5.08 15.14 L4.89 14.68 L1.80 14.50 L1.80 9.50 L4.89 9.32 L5.08 8.86 L3.02 6.55 L6.55 3.02 L8.86 5.08 L9.32 4.89 L9.50 1.80 L14.50 1.80 L14.68 4.89 L15.14 5.08 L17.45 3.02 L20.98 6.55 L18.92 8.86Z M15.3 12a3.3 3.3 0 1 0 -6.6 0a3.3 3.3 0 1 0 6.6 0Z"></path></svg></button>
<button aria-label="Close" style="width: 24px; height: 24px; padding: 0; border-radius: 5px; border: 1px solid #a8561a; background: #e07a24; color: #ffffff; font: 900 14px Nunito, sans-serif">×</button>
</div>
</div>
<div style="padding: 10px 12px; border-radius: 8px; background: #1c2127; border: 1px solid #47505a; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 700; color: #a9b0b8"><span>LAST SESSION</span><span>Lv. 59 · 34.07%</span></div>
<div style="height: 6px; border-radius: 3px; background: #3a414a; overflow: hidden"><div style="width: 34%; height: 6px; background: #b8e04a"></div></div>
<div style="height: 4px"></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: #f2f2f2"><span>Battle Duration</span><span style="color: {{accent}}">00:32:10</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: #f2f2f2"><span>EXP Acquired</span><span style="color: {{accent}}">82,340</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #c4cad1; padding-left: 10px"><span>per min</span><span>2,559 / min</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: #f2f2f2"><span>Mesos Acquired</span><span style="color: {{accent}}">41,205</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #c4cad1; padding-left: 10px"><span>per min</span><span>1,281 / min</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: #f2f2f2"><span>Next Level</span><span style="color: {{accent}}">~1h 41m</span></div>
</div>
<button style="height: 46px; border-radius: 23px; border: 2px solid #4d7a18; background: #79b534; box-shadow: inset 0 2px 0 #a4d65e; color: #ffffff; font: 900 18px Nunito, sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9.5"></circle><circle cx="12" cy="12" r="4" fill="currentColor"></circle></svg>
Start Analyzing</button>
<div style="text-align: center; font-size: 11px; font-weight: 700; color: #8f979f; letter-spacing: 0.02em; padding-bottom: 2px">for MapleStory Classic World · unofficial</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#ffb84a","#9fe0ff"]},"$preview":{"width":360,"height":420}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
